<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Console</title>
<link rel="stylesheet" href="assets/fontawesome/all.min.css">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#070b16;--p:#0f172a;--p2:#16213b;--ln:#243252;--tx:#e5eaf5;--mu:#8da0c4;--ac:#f59e0b;--gr:#10b981;--rd:#f43f5e;--bl:#38bdf8}
*{box-sizing:border-box}body{margin:0;font:14px 'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);overflow-x:hidden}
body:before,body:after{content:"";position:fixed;width:520px;height:520px;border-radius:50%;filter:blur(110px);opacity:.28;z-index:0;animation:fl 14s ease-in-out infinite alternate;pointer-events:none}
body:before{background:#2563eb;top:-160px;left:-120px}body:after{background:#f59e0b;bottom:-200px;right:-140px;animation-delay:-6s}
@keyframes fl{to{transform:translate(70px,50px) scale(1.15)}}
.hid{display:none!important}button{font:inherit;cursor:pointer}
#lg{position:relative;z-index:2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.lbox{width:100%;max-width:380px;background:#101a30cc;backdrop-filter:blur(16px);border:1px solid var(--ln);border-radius:20px;padding:28px;animation:up .6s cubic-bezier(.2,.8,.2,1)}
.lbox .ic{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--ac),#ef4444);display:grid;place-items:center;font-size:28px;margin:0 auto 12px;animation:pulse 2.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px #f59e0b00,0 0 30px #f59e0b66}0%,100%{box-shadow:0 0 0 0 #f59e0b55}}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
input,select,textarea{width:100%;padding:10px 12px;background:#0b1326;border:1px solid var(--ln);border-radius:10px;color:var(--tx);font:inherit;margin-top:4px;transition:.2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px #f59e0b30}
label{display:block;font-size:11px;font-weight:700;color:var(--mu);margin-top:10px;text-transform:uppercase;letter-spacing:.4px}label.ck{display:flex;gap:8px;align-items:center;text-transform:none;font-size:13px;color:var(--tx)}label.ck input{width:auto;margin:0}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:700;color:#fff;background:#1e2d4d;transition:.2s;display:inline-flex;gap:6px;align-items:center;margin:2px}.btn:hover{transform:translateY(-2px);filter:brightness(1.2)}
.btn.g{background:linear-gradient(135deg,#059669,#10b981)}.btn.r{background:linear-gradient(135deg,#e11d48,#f43f5e)}.btn.a{background:linear-gradient(135deg,#f59e0b,#f97316);color:#1a1205}.btn.s{padding:6px 10px;font-size:12px}
#app{position:relative;z-index:2;display:flex;min-height:100vh}
aside{width:230px;background:#0b1224e6;border-right:1px solid var(--ln);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;backdrop-filter:blur(10px)}
.brand{display:flex;gap:10px;align-items:center;font-weight:800;font-size:16px;padding:4px 8px 16px}.brand i{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--ac),#ef4444);display:grid;place-items:center}
aside button.nv{background:none;border:0;color:var(--mu);text-align:left;padding:11px 12px;border-radius:11px;font-weight:600;display:flex;gap:10px;align-items:center;transition:.2s;position:relative}
aside button.nv:hover{background:#16213b;color:#fff;padding-left:16px}aside button.nv.on{background:linear-gradient(90deg,#f59e0b26,transparent);color:var(--ac);box-shadow:inset 3px 0 var(--ac)}
.bdg{margin-left:auto;background:var(--rd);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;animation:pulse2 1.6s infinite}@keyframes pulse2{50%{transform:scale(1.2)}}
main{flex:1;padding:22px;min-width:0;max-width:1300px}h1{margin:0 0 16px;font-size:22px;display:flex;gap:10px;align-items:center;animation:up .4s}
.pg{animation:up .45s cubic-bezier(.2,.8,.2,1)}
.grid{display:grid;gap:14px}.g6{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}
.card{background:linear-gradient(160deg,var(--p2),var(--p));border:1px solid var(--ln);border-radius:16px;padding:16px;position:relative;transition:.25s;animation:up .5s backwards}.card.h:hover{transform:translateY(-4px);border-color:#3a4f7d;box-shadow:0 14px 34px #0008}
.st{display:flex;gap:12px;align-items:center}.st .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:20px}.st b{font-size:26px;display:block;line-height:1}.st span{color:var(--mu);font-size:12px}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:800}.t-a{background:#10b98122;color:#34d399}.t-b{background:#f43f5e22;color:#fb7185}.t-f{background:#38bdf822;color:#7dd3fc}.t-e{background:#f59e0b22;color:#fbbf24}
.bars{display:flex;align-items:flex-end;gap:12px;height:170px;padding-top:10px}.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mu)}
.bar i{display:block;width:100%;max-width:46px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,var(--ac),#ef4444);height:0;transition:height 1.1s cubic-bezier(.2,.8,.2,1)}.bar em{font-style:normal;color:var(--tx);font-weight:700;margin-bottom:4px}
.ring{width:84px;height:84px;position:relative;flex:none}.ring svg{transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:8;stroke-linecap:round}.ring .bg{stroke:#1e2d4d}.ring .fg{stroke-dasharray:226;stroke-dashoffset:226;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.ring div{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:800;line-height:1.05;font-size:18px}.ring small{display:block;font-size:9px;color:var(--mu);font-weight:600}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}.tools input{max-width:260px;margin:0}.chip{background:#16213b;border:1px solid var(--ln);color:var(--mu);border-radius:99px;padding:6px 13px;font-weight:700;font-size:12px;transition:.2s}.chip.on{background:var(--ac);color:#1a1205;border-color:var(--ac)}
table{width:100%;border-collapse:collapse}th,td{padding:10px 8px;border-bottom:1px solid #1d2b49;text-align:left;font-size:13px}th{color:var(--mu);font-size:11px;text-transform:uppercase}tr.rw{animation:up .4s backwards}.w{overflow-x:auto}
#dr{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:#0c1428;border-left:1px solid var(--ln);z-index:50;transform:translateX(105%);transition:transform .4s cubic-bezier(.2,.8,.2,1);overflow:auto;padding:18px}#dr.on{transform:none;box-shadow:-20px 0 60px #000a}
#ov{position:fixed;inset:0;background:#0009;z-index:40;opacity:0;pointer-events:none;transition:.3s}#ov.on{opacity:1;pointer-events:auto}
#md{position:fixed;inset:0;z-index:60;background:#000a;display:none;align-items:center;justify-content:center;padding:12px}#md>div{background:#0f1830;border:1px solid var(--ln);border-radius:18px;padding:20px;width:100%;max-width:520px;max-height:92vh;overflow:auto;animation:pop .25s}
#ts{position:fixed;right:16px;bottom:16px;z-index:99;display:flex;flex-direction:column;gap:8px}#ts div{background:#16213b;border:1px solid var(--ln);border-left:4px solid var(--ac);padding:11px 16px;border-radius:12px;animation:up .3s;box-shadow:0 8px 24px #0008}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #22314f}.kv span{color:var(--mu)}
.sk{height:14px;border-radius:7px;background:linear-gradient(90deg,#16213b,#22314f,#16213b);background-size:200% 100%;animation:sh 1.2s infinite;margin:8px 0}@keyframes sh{to{background-position:-200% 0}}
@media(max-width:820px){aside{position:fixed;bottom:0;top:auto;left:0;right:0;width:auto;height:auto;flex-direction:row;padding:6px;z-index:30;border-top:1px solid var(--ln);justify-content:space-around}aside .brand,aside .lo{display:none}aside button.nv{flex-direction:column;gap:2px;font-size:10px;padding:8px 6px}main{padding:14px 12px 90px}}
</style></head><body>
<div id="lg"><div class="lbox"><div class="ic"><i class="fa-solid fa-shield-halved"></i></div><h2 style="text-align:center;margin:0 0 4px">Admin Console</h2><p style="text-align:center;color:var(--mu);margin:0 0 8px">Restaurant subscriptions manager</p>
<label>Email<input id="le" type="email" autocomplete="username"></label><label>Password<input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"></label>
<p id="lerr" style="color:var(--rd);font-weight:700;min-height:18px"></p><button class="btn a" style="width:100%;justify-content:center" onclick="login()"><i class="fa-solid fa-right-to-bracket"></i> Login</button></div></div>
<div id="app" class="hid">
<aside><div class="brand"><i class="fa-solid fa-utensils"></i><span>Admin<br><small style="color:var(--mu);font-weight:500">POS Subscriptions</small></span></div>
<button class="nv on" data-t="dash"><i class="fa-solid fa-chart-pie"></i>Dashboard</button><button class="nv" data-t="rest"><i class="fa-solid fa-store"></i>Restaurants</button>
<button class="nv" data-t="pay"><i class="fa-solid fa-money-bill-wave"></i>Payments<span class="bdg hid" id="pb"></span></button><button class="nv" data-t="set"><i class="fa-solid fa-sliders"></i>Settings</button>
<button class="nv lo" style="margin-top:auto" onclick="logout()"><i class="fa-solid fa-power-off"></i>Logout</button></aside>
<main id="v"></main></div>
<div id="ov" onclick="closeD()"></div><div id="dr"></div><div id="md"><div id="mb"></div></div><div id="ts"></div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAgNQRFr-UWCjY0OYCbPYIPS71czHWMcxA",
  authDomain: "dairy1-1c7f0.firebaseapp.com",
  databaseURL: "https://dairy1-1c7f0-default-rtdb.firebaseio.com",
  projectId: "dairy1-1c7f0",
  storageBucket: "dairy1-1c7f0.firebasestorage.app",
  messagingSenderId: "384398878301",
  appId: "1:384398878301:web:32c4d8ab8edbd66137cfb4",
  measurementId: "G-L7VTQ63BEG"
};
const fbApp = firebase.initializeApp(firebaseConfig);
const auth = fbApp.auth();
const db = fbApp.database();
const secApp = firebase.initializeApp(firebaseConfig, 'secondary');
const secAuth = secApp.auth();
secAuth.setPersistence(firebase.auth.Auth.Persistence.NONE);

const $=i=>document.getElementById(i),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let R=[],P=[],S={},tab='dash',flt='all',q='',dId=null;
const toast=t=>{const e=document.createElement('div');e.textContent=t;$('ts').appendChild(e);setTimeout(()=>e.remove(),3800)};
const fd=d=>d?new Date(d).toLocaleDateString('en-GB'):'-',left=r=>r.expires_at?Math.ceil((new Date(r.expires_at)-Date.now())/864e5):0;
const seen=r=>r.last_seen&&Date.now()-new Date(r.last_seen)<120000;const ago=r=>{if(!r.last_seen)return'kabhi nahi';const m=Math.round((Date.now()-new Date(r.last_seen))/6e4);return m<60?m+' min pehle':m<1440?Math.round(m/60)+' ghante pehle':Math.round(m/1440)+' din pehle'};
const money=n=>'Rs '+Math.round(n).toLocaleString('en-US');
function st(r){if(r.blocked)return['Blocked','t-b','b'];if(r.is_free)return['Free forever','t-f','f'];if(!r.expires_at)return['No plan','t-e','e'];const d=left(r);if(d<=0)return['Expired','t-e','e'];if(d<=(S.warn_days||7))return['Expiring','t-e','x'];return['Active','t-a','a']}
function countUp(){document.querySelectorAll('[data-n]').forEach(e=>{const n=+e.dataset.n,pre=e.dataset.p||'',t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/900),v=Math.round(n*(1-Math.pow(1-k,3)));e.textContent=pre+v.toLocaleString('en-US');if(k<1)requestAnimationFrame(f)})(t0)})}
function anim(){requestAnimationFrame(()=>{document.querySelectorAll('.bar i').forEach(b=>b.style.height=b.dataset.h+'%');document.querySelectorAll('.ring .fg').forEach(c=>c.style.strokeDashoffset=c.dataset.o);countUp()})}

async function login(){
  $('lerr').textContent='';
  try{
    const cred=await auth.signInWithEmailAndPassword($('le').value.trim(),$('lp').value);
    await init(cred.user);
  }catch(e){
    $('lerr').textContent=e.message;
  }
}
async function init(u){
  try{
    const snap=await db.ref('admins/'+u.uid).once('value');
    if(snap.val()!==true){
      await auth.signOut();
      $('lerr').textContent='Yeh account admin nahi hai (Firebase Database mein admins/'+u.uid+' = true add karein).';
      return;
    }
    $('lg').classList.add('hid');$('app').classList.remove('hid');await load();show();
  }catch(e){
    $('lerr').textContent=e.message;
  }
}
async function logout(){await auth.signOut();location.reload()}
async function load(){
  try{
    const[a,b,c]=await Promise.all([
      db.ref('restaurants').once('value'),
      db.ref('payments').once('value'),
      db.ref('pay_settings').once('value')
    ]);
    const rObj=a.val()||{};
    R=Object.entries(rObj).map(([k,v])=>({...v,user_id:k})).sort((x,y)=>new Date(y.created_at||0)-new Date(x.created_at||0));
    const pObj=b.val()||{};
    P=Object.entries(pObj).map(([k,v])=>({...v,id:k})).sort((x,y)=>new Date(y.created_at||0)-new Date(x.created_at||0));
    S=c.val()||{};
  }catch(e){
    toast('Error: '+e.message);
  }
  const n=P.filter(p=>p.status==='pending').length;$('pb').textContent=n;$('pb').classList.toggle('hid',!n);
}
document.querySelector('aside').onclick=e=>{const b=e.target.closest('.nv');if(b&&b.dataset.t){tab=b.dataset.t;document.querySelectorAll('aside .nv').forEach(x=>x.classList.toggle('on',x===b));show()}};
function show(){const f={dash:vDash,rest:vRest,pay:vPay,set:vSet}[tab];$('v').innerHTML='<div class="pg">'+f()+'</div>';if(tab==='set')qrPrev();anim()}
async function refresh(){$('v').innerHTML='<div class="card"><div class="sk"></div><div class="sk" style="width:60%"></div></div>';await load();show();if(dId)openD(dId,1)}

/* ---------- Dashboard ---------- */
function monthsRev(){const m=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);m.push({k:d.getFullYear()+'-'+d.getMonth(),l:d.toLocaleString('en',{month:'short'}),v:0})}
P.filter(p=>p.status==='approved').forEach(p=>{const d=new Date(p.decided_at||p.created_at),x=m.find(y=>y.k===d.getFullYear()+'-'+d.getMonth());if(x)x.v+=+p.amount||0});return m}
function vDash(){const c=k=>R.filter(r=>st(r)[2]===k).length,pend=P.filter(p=>p.status==='pending'),mr=monthsRev(),mx=Math.max(1,...mr.map(x=>x.v)),tot=P.filter(p=>p.status==='approved').reduce((a,p)=>a+(+p.amount||0),0);
const card=(i,col,n,l,pre)=>`<div class="card h"><div class="st"><div class="ico" style="background:${col}22;color:${col}"><i class="fa-solid ${i}"></i></div><div><b data-n="${n}" data-p="${pre||''}">0</b><span>${l}</span></div></div></div>`;
const soon=R.filter(r=>['x','e'].includes(st(r)[2])).sort((a,b)=>left(a)-left(b));
return`<h1><i class="fa-solid fa-chart-pie" style="color:var(--ac)"></i>Dashboard</h1><div class="grid g6">${card('fa-store','#38bdf8',R.length,'Total restaurants')}${card('fa-circle-check','#10b981',c('a')+c('f'),'Active')}${card('fa-hourglass-half','#f59e0b',c('x'),'Expiring soon')}${card('fa-circle-xmark','#fb923c',c('e'),'Expired')}${card('fa-ban','#f43f5e',c('b'),'Blocked')}${card('fa-clock','#a78bfa',pend.length,'Pending payments')}</div>
<div class="grid g2" style="margin-top:14px"><div class="card"><b>Revenue (last 6 months)</b> <span style="float:right;color:var(--gr);font-weight:800">Total ${money(tot)}</span><div class="bars">${mr.map(x=>`<div class="bar"><em>${x.v?Math.round(x.v/1000*10)/10+'k':''}</em><i data-h="${Math.max(x.v?6:2,x.v/mx*100)}"></i>${x.l}</div>`).join('')}</div></div>
<div class="card"><b><i class="fa-solid fa-bell" style="color:var(--ac)"></i> Renewal needed</b><div style="margin-top:8px">${soon.slice(0,6).map(r=>`<div class="kv" style="cursor:pointer" onclick="openD('${r.user_id}')"><b>${esc(r.name)}</b><span class="tag ${st(r)[1]}">${left(r)<=0?'Expired':left(r)+' din'}</span></div>`).join('')||'<span style="color:var(--mu)">Sab theek hai ✔</span>'}</div></div></div>
<div class="card" style="margin-top:14px"><b>Latest payments</b><div class="w"><table>${P.slice(0,6).map(p=>`<tr><td>${new Date(p.created_at).toLocaleDateString('en-GB')}</td><td>${esc(p.restaurant_name)}</td><td>${esc(p.method)}</td><td>${money(p.amount)}</td><td><span class="tag ${p.status==='approved'?'t-a':p.status==='rejected'?'t-b':'t-e'}">${p.status}</span></td></tr>`).join('')||'<tr><td>Abhi koi payment nahi</td></tr>'}</table></div></div>`}

/* ---------- Restaurants ---------- */
function ring(r,big){if(r.is_free)return`<div class="ring"><svg width="84" height="84"><circle class="bg" cx="42" cy="42" r="36"/><circle class="fg" cx="42" cy="42" r="36" stroke="#38bdf8" data-o="0"/></svg><div style="color:#38bdf8;font-size:26px">∞</div></div>`;
const d=Math.max(0,left(r)),tot=r.plan_days||30,pc=Math.min(1,d/tot),col=d<=0?'#fb923c':d<=(S.warn_days||7)?'#f59e0b':'#10b981';
return`<div class="ring"><svg width="84" height="84"><circle class="bg" cx="42" cy="42" r="36"/><circle class="fg" cx="42" cy="42" r="36" stroke="${col}" data-o="${226*(1-pc)}"/></svg><div style="color:${col}">${d}<small>din</small></div></div>`}
function vRest(){const L=R.filter(r=>(flt==='all'||st(r)[2]===flt||(flt==='a'&&st(r)[2]==='f'))&&(!q||((r.name||'')+(r.email||'')+(r.phone||'')).toLowerCase().includes(q)));
const ch=[['all','All'],['a','Active'],['x','Expiring'],['e','Expired'],['b','Blocked'],['f','Free']];
return`<h1><i class="fa-solid fa-store" style="color:var(--ac)"></i>Restaurants</h1><div class="tools"><button class="btn g" onclick="addM()"><i class="fa-solid fa-plus"></i> New Restaurant</button><button class="btn" onclick="refresh()"><i class="fa-solid fa-rotate"></i></button><input placeholder="Search name / email / phone" value="${esc(q)}" oninput="q=this.value.toLowerCase();clearTimeout(window._t);window._t=setTimeout(()=>{show();const i=document.querySelector('.tools input');i.focus();i.setSelectionRange(99,99)},250)">${ch.map(c=>`<button class="chip ${flt===c[0]?'on':''}" onclick="flt='${c[0]}';show()">${c[1]}</button>`).join('')}</div>
<div class="grid g3">${L.map((r,i)=>{const s=st(r);return`<div class="card h" style="animation-delay:${i*50}ms"><div style="display:flex;gap:14px;align-items:center">${ring(r)}<div style="min-width:0"><b style="font-size:16px">${esc(r.name)}</b><br><small style="color:var(--mu);word-break:break-all">${esc(r.email)}</small><br><span class="tag ${s[1]}">${s[0]}</span> ${r.cloud_sync?'<span class="tag t-f"><i class="fa-solid fa-cloud"></i> data online</span>':'<span class="tag t-e">data offline</span>'}<br><span class="tag ${seen(r)?'t-a':'t-e'}"><i class="fa-solid fa-circle" style="font-size:7px"></i> ${seen(r)?'Online now':'Last seen '+ago(r)}</span></div></div>
<div class="kv" style="margin-top:10px"><span>Plan</span><b>${r.is_free?'Permanent free':!r.expires_at?'No plan (payment pending)':esc(r.plan_name)+' · '+r.plan_days+'d'}</b></div><div class="kv"><span>Fee</span><b>${money(r.fee||0)}</b></div><div class="kv"><span>Expiry</span><b>${r.is_free?'-':fd(r.expires_at)}</b></div>
<div style="margin-top:10px"><button class="btn s a" onclick="openD('${r.user_id}')"><i class="fa-solid fa-eye"></i> Details</button><button class="btn s ${r.blocked?'g':'r'}" onclick="blk('${r.user_id}')"><i class="fa-solid ${r.blocked?'fa-unlock':'fa-ban'}"></i> ${r.blocked?'Unblock':'Block'}</button><button class="btn s" onclick="renew('${r.user_id}')"><i class="fa-solid fa-calendar-plus"></i> Renew</button></div></div>`}).join('')||'<div class="card">Koi restaurant nahi mila</div>'}</div>`}
async function openD(id,keep){dId=id;const r=R.find(x=>x.user_id===id);if(!r)return;const s=st(r),my=P.filter(p=>p.user_id===id);
$('dr').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">${esc(r.name)}</h2><button class="btn s" onclick="closeD()"><i class="fa-solid fa-xmark"></i></button></div>
<div style="display:flex;gap:14px;align-items:center;margin:14px 0">${ring(r)}<div><span class="tag ${s[1]}">${s[0]}</span><p style="margin:6px 0 0;color:var(--mu)">${r.is_free?'Kabhi expire nahi hoga':'Expiry: <b style="color:var(--tx)">'+fd(r.expires_at)+'</b>'}</p></div></div>
<div class="card"><div class="kv"><span>Login email</span><b>${esc(r.email)}</b></div><div class="kv"><span>Phone</span><b>${esc(r.phone)||'-'}</b></div><div class="kv"><span>Plan</span><b>${r.is_free?'Free':!r.expires_at?'No plan':esc(r.plan_name)+' ('+r.plan_days+' din)'}</b></div><div class="kv"><span>Fee</span><b>${money(r.fee||0)}</b></div><div class="kv"><span>Joined</span><b>${fd(r.created_at)}</b></div><div class="kv"><span>Last seen</span><b>${seen(r)?'Online now':ago(r)}</b></div><div class="kv"><span>Pay button</span><b>${r.force_pay?'Forced ON':'Auto'}</b></div><div class="kv"><span>Notice</span><b style="max-width:60%;text-align:right">${esc(r.notice)||'-'}</b></div>${r.notes?`<div class="kv"><span>Admin notes</span><b style="max-width:60%;text-align:right">${esc(r.notes)}</b></div>`:''}</div>
<div class="card" style="margin-top:12px"><b><i class="fa-solid fa-cloud" style="color:var(--bl)"></i> Online data</b><div id="od"><div class="sk"></div><div class="sk" style="width:70%"></div></div></div>
<div style="margin:12px 0"><button class="btn a" onclick="editM('${id}')"><i class="fa-solid fa-pen"></i> Edit / Plan</button><button class="btn g" onclick="renew('${id}')"><i class="fa-solid fa-calendar-plus"></i> +${r.plan_days}d</button><button class="btn" onclick="addDays('${id}')"><i class="fa-solid fa-plus"></i> Custom days</button><button class="btn" onclick="fp('${id}')"><i class="fa-solid fa-credit-card"></i> ${r.force_pay?'Hide':'Show'} Pay btn</button><button class="btn ${r.blocked?'g':'r'}" onclick="blk('${id}')">${r.blocked?'Unblock':'Block'}</button><button class="btn" onclick="setPw('${id}')"><i class="fa-solid fa-key"></i> Reset Password</button><button class="btn r" onclick="delR('${id}')"><i class="fa-solid fa-trash"></i> Delete</button></div>
<div class="card"><b>Payment history (${my.length})</b>${my.map(p=>`<div class="kv"><span>${new Date(p.created_at).toLocaleDateString('en-GB')} · ${esc(p.method)} · ${esc(p.tid)}</span><b>${money(p.amount)} <span class="tag ${p.status==='approved'?'t-a':p.status==='rejected'?'t-b':'t-e'}">${p.status}</span></b></div>`).join('')||'<p style="color:var(--mu)">Koi payment nahi</p>'}</div>`;
$('dr').classList.add('on');$('ov').classList.add('on');anim();
db.ref('pos_data/'+id).once('value').then(snap=>{const e=$('od');if(!e||dId!==id)return;
const data=snap.val();
if(!data){e.innerHTML='<p style="color:var(--mu)">'+(r.cloud_sync?'Abhi tak koi data sync nahi hua.':'Is restaurant ka data sirf offline hai.')+'</p>';return}
const v=data.value||{},m=Array.isArray(v.menu)?v.menu:Object.values(v.menu||{}),o=Array.isArray(v.orders)?v.orders:Object.values(v.orders||{}),td=new Date().toISOString().slice(0,10),sum=a=>a.reduce((x,y)=>x+(+y.netPayable||0),0);
e.innerHTML=`<div class="kv"><span>Last sync</span><b>${data.updated_at?new Date(data.updated_at).toLocaleString():'-'}</b></div><div class="kv"><span>Menu items</span><b>${m.length}</b></div><div class="kv"><span>Total bills</span><b>${o.length}</b></div><div class="kv"><span>Total sales</span><b>${money(sum(o))}</b></div><div class="kv"><span>Aaj ki sales</span><b>${money(sum(o.filter(x=>x.date===td)))}</b></div>`})
.catch(err=>{const e=$('od');if(e&&dId===id)e.innerHTML='<p style="color:var(--rd)">'+esc(err.message)+'</p>';})}
function closeD(){dId=null;$('dr').classList.remove('on');$('ov').classList.remove('on')}

/* ---------- Payments ---------- */
let pf='pending';
function vPay(){const L=P.filter(p=>pf==='all'||p.status===pf),ap=P.filter(p=>p.status==='approved').reduce((a,p)=>a+(+p.amount||0),0),pe=P.filter(p=>p.status==='pending').reduce((a,p)=>a+(+p.amount||0),0);
return`<h1><i class="fa-solid fa-money-bill-wave" style="color:var(--ac)"></i>Payments</h1><div class="grid g6" style="margin-bottom:14px"><div class="card"><div class="st"><div><b data-n="${ap}" data-p="Rs ">0</b><span>Approved total</span></div></div></div><div class="card"><div class="st"><div><b data-n="${pe}" data-p="Rs ">0</b><span>Pending amount</span></div></div></div></div>
<div class="tools">${['pending','approved','rejected','all'].map(c=>`<button class="chip ${pf===c?'on':''}" onclick="pf='${c}';show()">${c}</button>`).join('')}</div>
<div class="card w"><table><tr><th>Date</th><th>Restaurant</th><th>Method</th><th>Amount</th><th>TID</th><th>Status</th><th></th></tr>${L.map((p,i)=>`<tr class="rw" style="animation-delay:${i*40}ms"><td>${new Date(p.created_at).toLocaleString()}</td><td><b>${esc(p.restaurant_name)}</b></td><td>${esc(p.method)}</td><td>${money(p.amount)}</td><td><b>${esc(p.tid)}</b></td><td><span class="tag ${p.status==='approved'?'t-a':p.status==='rejected'?'t-b':'t-e'}">${p.status}</span></td>
<td>${p.status==='pending'?`<button class="btn s g" onclick="dec('${esc(p.id)}',1)"><i class="fa-solid fa-check"></i> Approve +${p.plan_days}d</button><button class="btn s r" onclick="dec('${esc(p.id)}',0)"><i class="fa-solid fa-xmark"></i></button>`:''}</td></tr>`).join('')||'<tr><td colspan=7>Koi payment nahi</td></tr>'}</table></div>`}

/* ---------- Settings ---------- */
function pm(k,n,ic){const x=S[k]||{};return`<div class="card"><b><i class="${ic}"></i> ${n}</b><label>Type<select id="${k}_m" onchange="qrPrev()"><option value="till" ${x.mode!=='qr'?'selected':''}>Till ID - auto QR (amount auto)</option><option value="qr" ${x.mode==='qr'?'selected':''}>Simple QR image link</option></select></label>
<label>Till ID<input id="${k}_t" value="${esc(x.till)}" oninput="qrPrev()"></label><label>Merchant / account name<input id="${k}_n" value="${esc(x.name)}" oninput="qrPrev()"></label><label>QR image link (https://...)<input id="${k}_q" value="${esc(x.qr)}" oninput="qrPrev()"></label><div id="${k}_pv" style="display:flex;justify-content:center;margin-top:12px;min-height:60px"></div></div>`}
function vSet(){return`<h1><i class="fa-solid fa-sliders" style="color:var(--ac)"></i>Settings</h1><div class="grid g2">${pm('easypaisa','Easypaisa','fa-solid fa-mobile-screen')}${pm('jazzcash','JazzCash','fa-solid fa-wallet')}</div>
<div class="card" style="margin-top:14px"><label>Payment instructions (restaurant ko payment panel mein dikhengi)<textarea id="ins" rows="3" placeholder="Jaise: Payment ke baad TID zaroor likhein. Masla ho to 03xx-xxxxxxx par rabta karein.">${esc(S.instructions)}</textarea></label><label>Expiry notice kitne din pehle dikhe<input id="wd" type="number" value="${S.warn_days||7}"></label><label>Sab restaurants ke liye notice (optional)<textarea id="gn" rows="2">${esc(S.notice)}</textarea></label><button class="btn g" style="margin-top:10px" onclick="saveSet()"><i class="fa-solid fa-floppy-disk"></i> Save Settings</button></div>`}
const tlv=(t,v)=>t+String(v.length).padStart(2,'0')+v;
function crc(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=c&0x8000?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
function emv(till,amt,name,brand){const m=tlv('00','com.'+brand)+tlv('01',till);const s=tlv('00','01')+tlv('01','12')+tlv('26',m)+tlv('52','5812')+tlv('53','586')+tlv('54',Number(amt).toFixed(2))+tlv('58','PK')+tlv('59',(name||'Merchant').slice(0,25))+tlv('60','Pakistan')+'6304';return s+crc(s)}
function qrPrev(){['easypaisa','jazzcash'].forEach(k=>{const e=$(k+'_pv');if(!e)return;e.innerHTML='';const m=$(k+'_m').value,t=$(k+'_t').value.trim(),u=$(k+'_q').value.trim();
if(m==='till'&&t){e.style.flexDirection='column';e.style.alignItems='center';e.innerHTML='<div style="color:var(--ac);font-weight:800;margin-bottom:8px">Scan only with '+(k==='easypaisa'?'Easypaisa':'JazzCash')+'</div><div id="'+k+'_c" style="background:#fff;padding:8px;border-radius:10px"></div><small style="color:var(--mu)">Preview (Rs 1000 sample)</small>';new QRCode($(k+'_c'),{text:emv(t,1000,$(k+'_n').value,k),width:150,height:150})}
else if(m==='qr'&&u)e.innerHTML='<img src="'+esc(u)+'" style="max-width:170px;border-radius:10px;background:#fff;padding:6px">'})}
async function saveSet(){const g=k=>({mode:$(k+'_m').value,till:$(k+'_t').value.trim(),name:$(k+'_n').value.trim(),qr:$(k+'_q').value.trim()});
S={easypaisa:g('easypaisa'),jazzcash:g('jazzcash'),warn_days:+$('wd').value||7,instructions:$('ins').value.trim(),notice:$('gn').value.trim()};
try{await db.ref('pay_settings').set(S);toast('Settings save ho gayi ✔')}catch(e){toast(e.message)}}

/* ---------- Forms & actions ---------- */
const mo=h=>{$('mb').innerHTML=h;$('md').style.display='flex'},cm=()=>$('md').style.display='none';
function planF(r){r=r||{plan_name:'monthly',plan_days:30,fee:0,cloud_sync:true};const ex=r.expires_at?r.expires_at.slice(0,10):'';
return`<label>Restaurant name<input id="f_n" value="${esc(r.name)}"></label><label>Phone<input id="f_p" value="${esc(r.phone)}"></label><label>Plan<select id="f_pl" onchange="pc()"><option value="weekly">Weekly (7 din)</option><option value="monthly">Monthly (30 din)</option><option value="custom">Custom days</option><option value="free">Permanent Free</option><option value="none">No plan (pehle payment karni hogi)</option></select></label>
<label>Plan days<input id="f_d" type="number" value="${r.plan_days}"></label><label>Fee (Rs) - restaurant yehi amount pay karega<input id="f_f" type="number" value="${r.fee||0}"></label><label>Expiry date<input id="f_e" type="date" value="${ex}"></label>
<label class="ck" style="margin-top:12px"><input id="f_c" type="checkbox" ${r.cloud_sync?'checked':''}> Data online (Firebase) rakhna hai</label><label>Notice (is restaurant ke liye)<textarea id="f_no" rows="2">${esc(r.notice)}</textarea></label><label>Admin notes (private)<textarea id="f_nt" rows="2">${esc(r.notes)}</textarea></label>`}
function pc(){const v=$('f_pl').value;if(v==='weekly')$('f_d').value=7;if(v==='monthly')$('f_d').value=30;if(v==='none'||v==='free')$('f_e').value='';else $('f_e').value=new Date(Date.now()+$('f_d').value*864e5).toISOString().slice(0,10)}
function addM(){mo(`<h3 style="margin-top:0">New Restaurant</h3><label>Login Email (Gmail)<input id="f_em" type="email"></label><label>Password (min 6)<input id="f_pw" type="text"></label>${planF()}<p><button class="btn g" onclick="addR()"><i class="fa-solid fa-check"></i> Create</button><button class="btn" onclick="cm()">Cancel</button></p>`);$('f_pl').value='monthly';pc()}
function editM(id){const r=R.find(x=>x.user_id===id);mo(`<h3 style="margin-top:0">Edit: ${esc(r.name)}</h3>${planF(r)}<p><button class="btn g" onclick="saveR('${id}')">Save</button><button class="btn" onclick="cm()">Cancel</button></p>`);$('f_pl').value=r.is_free?'free':(!r.expires_at?'none':(['weekly','monthly'].includes(r.plan_name)?r.plan_name:'custom'))}
function vals(){const pl=$('f_pl').value,free=pl==='free';return{name:$('f_n').value.trim(),phone:$('f_p').value.trim(),plan_name:pl,plan_days:+$('f_d').value||30,fee:+$('f_f').value||0,is_free:free,expires_at:free||pl==='none'||!$('f_e').value?null:new Date($('f_e').value+'T23:59:59').toISOString(),cloud_sync:$('f_c').checked,notice:$('f_no').value.trim(),notes:$('f_nt').value.trim()}}

async function addR(){
  const em=$('f_em').value.trim(),pw=$('f_pw').value,v=vals();
  if(!em||pw.length<6||!v.name)return toast('Name, email aur 6+ password zaroori hai');
  try{
    await secAuth.signOut().catch(()=>{});
    const cred=await secAuth.createUserWithEmailAndPassword(em,pw);
    const uid=cred.user.uid;
    await secAuth.signOut().catch(()=>{});
    await db.ref('restaurants/'+uid).set({...v,user_id:uid,email:em,blocked:false,force_pay:false,last_seen:null,created_at:new Date().toISOString()});
    cm();await load();show();toast('Restaurant ban gaya ✔  Email: '+em);
  }catch(e){toast(e.message)}
}
async function setPw(id){
  const r=R.find(x=>x.user_id===id);if(!r||!r.email)return toast('Email nahi mila');
  if(!confirm(r.email+' par password reset email bhejein?'))return;
  try{await auth.sendPasswordResetEmail(r.email);toast('Password reset link '+r.email+' par bhej diya gaya ✔')}
  catch(e){toast(e.message)}
}
async function delR(id){
  const r=R.find(x=>x.user_id===id);
  if(!confirm(r.name+' ko HAMESHA ke liye delete karein? Uska online data aur payments bhi chale jayenge.'))return;
  try{
    const updates={};
    updates['restaurants/'+id]=null;
    updates['pos_data/'+id]=null;
    P.filter(p=>p.user_id===id).forEach(p=>{updates['payments/'+p.id]=null});
    await db.ref().update(updates);
    closeD();await refresh();toast('Delete ho gaya');
  }catch(e){toast(e.message)}
}
async function saveR(id){try{await db.ref('restaurants/'+id).update(vals());toast('Save ho gaya ✔');cm();await refresh()}catch(e){toast(e.message)}}
async function blk(id){const r=R.find(x=>x.user_id===id);if(!confirm((r.blocked?'Unblock ':'Block ')+r.name+'?'))return;try{await db.ref('restaurants/'+id).update({blocked:!r.blocked});await refresh();toast(r.blocked?'Unblock ho gaya - user ko 30 sec mein pata chal jayega':'Block ho gaya - user ki screen 30 sec mein lock ho jayegi')}catch(e){toast('Block nahi hua: '+e.message)}}
async function fp(id){const r=R.find(x=>x.user_id===id);try{await db.ref('restaurants/'+id).update({force_pay:!r.force_pay});await refresh()}catch(e){toast(e.message)}}
function ext(r,days){const b=Math.max(Date.now(),r.expires_at?new Date(r.expires_at).getTime():0);return new Date(b+days*864e5).toISOString()}
async function renew(id){const r=R.find(x=>x.user_id===id);if(!confirm(r.name+': '+r.plan_days+' din barhayein?'))return;try{await db.ref('restaurants/'+id).update({expires_at:ext(r,r.plan_days),is_free:false});await refresh();toast('Plan barh gaya ✔')}catch(e){toast(e.message)}}
async function addDays(id){const r=R.find(x=>x.user_id===id),n=+prompt('Kitne din add karne hain?','30');if(!n)return;try{await db.ref('restaurants/'+id).update({expires_at:ext(r,n),is_free:false});await refresh();toast(n+' din add ho gaye ✔')}catch(e){toast(e.message)}}
async function dec(id,ok){const p=P.find(x=>String(x.id)===String(id)),r=p&&R.find(x=>x.user_id===p.user_id);if(!p)return toast('Payment nahi mili');
try{if(ok){if(!r)return toast('Restaurant nahi mila');await db.ref('restaurants/'+r.user_id).update({expires_at:ext(r,p.plan_days||r.plan_days),is_free:false,force_pay:false})}
await db.ref('payments/'+id).update({status:ok?'approved':'rejected',decided_at:new Date().toISOString()});await refresh();toast(ok?'Approved - plan barh gaya ✔':'Reject ho gaya')}catch(e){toast(e.message)}}

setInterval(async()=>{if(!$('app').classList.contains('hid')&&!$('md').style.display.includes('flex')&&!dId){await load();show()}},30000);
const unsubAuth=auth.onAuthStateChanged(u=>{unsubAuth();if(u)init(u)});
</script></body></html>

.out{margin-top:auto;padding-top:14px}.out a{display:flex;gap:10px;padding:10px 12px;border-radius:10px;color:var(--bad);text-decoration:none;font-weight:600}
.out small{display:block;text-align:center;color:var(--mute);font-size:9px;margin-top:8px}

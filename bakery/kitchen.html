<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alpha Bakers - Kitchen Stock Usage</title>
<script src="ab-sync.js" data-pos="0"></script><script src="frame.js"></script><script type="module" src="firebase-core.js"></script>
<style>
:root{--bg:#f8fafc;--line:#e2e8f0;--ink:#1e293b;--mute:#64748b;--gold:#b8892a;--goldd:#8a6418;--goldl:#fbf5e6;--bad:#dc2626;--ok:#16a34a}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--ink);font:14px system-ui,Segoe UI,sans-serif;display:flex;min-height:100vh}aside{width:232px;background:#fff;border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;flex-shrink:0;overflow:auto}.brand{text-align:center;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:12px}.brand b{display:block;font:700 19px Georgia,serif;color:var(--goldd);letter-spacing:.14em;margin-top:6px}.brand small{color:var(--mute);letter-spacing:.3em;font-size:9px}aside a{display:flex;gap:10px;padding:10px 12px;border-radius:10px;color:var(--ink);text-decoration:none;margin-bottom:2px;font-weight:600}aside a:hover{background:var(--goldl)}aside a.on{background:var(--gold);color:#fff}
main{flex:1;padding:24px 30px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:18px}.top h1{font:800 26px Georgia,serif;color:var(--goldd)}.top p{color:var(--mute);font-size:12px}.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}.g2{display:grid;gap:16px;grid-template-columns:1fr 1fr}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.card h3{font:700 15px Georgia,serif;color:var(--goldd);margin-bottom:10px}button,input,textarea{font:inherit;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 11px}input,textarea{width:100%}button{cursor:pointer;background:var(--gold);color:#fff;font-weight:700;border:0}button:disabled{opacity:.55;cursor:not-allowed}button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}button.sm{padding:5px 9px;font-size:12px}label{display:block;font-size:10px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.row>div{flex:1;min-width:130px}.stock-card{border:1px solid var(--line);border-radius:12px;padding:12px}.stock-card.selected{border-color:var(--gold);background:var(--goldl)}.tag{padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;background:#f1f5f9}.low{color:var(--bad);font-weight:700}.okc{color:var(--ok);font-weight:700}.err{color:var(--bad);font-weight:700}.sc{overflow:auto}table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--mute);font-size:10px;text-transform:uppercase;letter-spacing:.08em;background:#f8fafc}th,td{padding:9px 8px;border-bottom:1px solid var(--line)}.qty{max-width:110px}.qty.invalid{border:2px solid var(--bad);background:#fff1f2}.np{}@media(max-width:850px){body{flex-direction:column}aside{width:100%;height:auto;position:static}.g2{grid-template-columns:1fr}main{padding:14px}.grid{grid-template-columns:1fr 1fr}}@media(max-width:500px){.grid{grid-template-columns:1fr}}@media print{aside,.np{display:none!important}main{padding:0}}
</style></head><body><main>
<div id="hd"></div>
<div class="g2 np" style="margin-bottom:14px">
 <div class="card"><h3>Reference / Hawala</h3><div class="row"><div><label>Reference</label><input id="ref" placeholder="Morning Kitchen"></div><div><label>Note / Remarks</label><textarea id="note" rows="2"></textarea></div></div></div>
 <div class="card"><h3>Search Stock</h3><label>Search item/material</label><input id="stockSearch" placeholder="Search item..." autocomplete="off"></div>
</div>
<div class="grid np" id="stockCards" style="margin-bottom:14px"></div>
<div class="card np" style="margin-bottom:14px"><h3>Selected Kitchen Materials</h3><div class="sc"><table><thead><tr><th>NO</th><th>ITEM</th><th>AVAILABLE</th><th>UNIT</th><th>USED QTY</th><th>REMAINING</th><th>ACTION</th></tr></thead><tbody id="selectedBody"></tbody></table></div><div class="row" style="margin-top:12px;justify-content:flex-end"><div style="flex:0 0 auto"><button id="saveBtn" onclick="saveKitchen()">SAVE KITCHEN USAGE</button></div><div style="flex:0 0 auto"><button id="printLast" class="ghost" onclick="printLast()">PRINT KITCHEN SLIP</button></div></div><p id="saveMsg" style="margin-top:8px"></p></div>
<div class="card np" style="margin-bottom:14px"><h3>Kitchen Usage Summary</h3><div class="row"><div><label>Date</label><input id="summaryDate" type="date"></div><div style="flex:0 0 auto"><button class="ghost" onclick="printDaily()">PRINT DAILY KITCHEN REPORT</button></div></div><div id="dailySummary" style="margin-top:10px"></div></div>
<div class="card sc np"><h3>Kitchen Usage History</h3><div class="row" style="margin-bottom:10px"><div><label>Search Kitchen Records</label><input id="recordSearch" placeholder="Usage ID, Hawala, item, date, staff"></div><div><label>From Date</label><input id="fromDate" type="date"></div><div><label>To Date</label><input id="toDate" type="date"></div><button class="ghost" onclick="drawHistory()">Search</button></div><table><thead><tr><th>Usage ID</th><th>Date</th><th>Time</th><th>Reference/Hawala</th><th>Items</th><th>Total Qty</th><th>Created By</th><th>Actions</th></tr></thead><tbody id="historyBody"></tbody></table></div>
</main>
<script>
const AB={
 db:{get(k,d){try{const v=localStorage.getItem('ab_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('ab_'+k,JSON.stringify(v))}catch(e){}}},
 cfg(){const d={biz:'ALPHA BAKERS',phone:'',addr:'',pin:'7150',hidden:[]};return Object.assign(d,AB.db.get('settings',{}))},
 uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)},
 today(){const d=new Date();if(d.getHours()<3||(d.getHours()==3&&d.getMinutes()<30))d.setDate(d.getDate()-1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},
 now(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0')},
 win(title,body){const w=window.open('','_blank','width=380,height=600');if(!w)return alert('Allow popups to print');w.document.write('<html><head><title>'+title+'</title><style>*{box-sizing:border-box}body{width:72mm;margin:0 auto;padding:2mm 2mm 16mm;font:bold 10px Arial;color:#000}table{width:100%;border-collapse:collapse}td,th{padding:3px 0;text-align:left}td:last-child,th:last-child{text-align:right}h2{text-align:center;font-size:13px}@page{size:80mm auto;margin:0}</style></head><body><h2>'+esc(AB.cfg().biz)+'</h2><p style="text-align:center;font-size:8px">'+esc(AB.cfg().addr||'')+' '+esc(AB.cfg().phone||'')+'</p><p style="text-align:center;border-bottom:1.5px solid #000;padding-bottom:4px;margin-bottom:6px">'+esc(title)+'</p>'+body+'<p style="text-align:center;font-size:8px;margin-top:12px;border-top:1px dashed #000;padding-top:4px">Designed &amp; Developed by Scale Soft Group</p><script>onload=function(){print();setTimeout(close,500)}<\/script></body></html>');w.document.close()},
 shell(){if(window.top!==window)return;const mods=[['index','index.html','◈','Dashboard'],['pos','pos.html','🧾','Orders / POS'],['stock','stock.html','📦','Stock & Materials'],['kitchen','kitchen.html','🍳','Kitchen Usage'],['staff','staffmanage.html','👥','Staff & Salary'],['production','production.html','🍞','Production'],['suppliers','suppliers.html','🚚','Suppliers'],['accounts','accounts.html','💰','Accounts'],['reports','reports.html','📊','Reports'],['settings','settings.html','⚙️','Settings']];
 const a=document.createElement('aside');a.innerHTML='<div class="brand"><b>'+esc(AB.cfg().biz)+'</b><small>ARTISAN · BAKERY</small></div>'+mods.filter(m=>!AB.cfg().hidden.includes(m[0])||m[0]=='settings'||m[0]=='index').map(m=>'<a class="'+(m[0]=='kitchen'?'on':'')+'" href="'+m[1]+'"><span>'+m[2]+'</span>'+m[3]+'</a>').join('')+'<a href="#" onclick="logout();return false" style="margin-top:14px;color:var(--bad)">⎋ Logout</a>';document.body.prepend(a)}
};
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]))}
function logout(){window.__fbReady.then(function(FB){return FB.logout()}).catch(function(){}).then(function(){(window.top||window).location.href='login.html'})}
AB.shell();
let selected=new Map(),lastRecord=null,currentUser='',saving=false;
hd.innerHTML='<header class="top"><div><h1>Kitchen Stock Usage</h1><p>Select stock items used in the kitchen and save the usage record.</p></div></header>';
if(!AB.db.get('stock',null)){
 const seed=[['Flour (Maida)','kg',120,50,110],['Sugar','kg',40,20,150],['Yeast','kg',3,2,900],['Butter','kg',15,10,1800],['Eggs','tray',6,4,420],['Milk','L',30,20,170],['Cooking Oil','L',20,10,480]];
 AB.db.set('stock',seed.map(a=>({id:AB.uid(),name:a[0],unit:a[1],qty:a[2],min:a[3],rate:a[4]})));
}
summaryDate.value=AB.today();
window.__fbReady.then(function(FB){return FB.authReady}).then(function(u){currentUser=u&&u.email||''}).catch(()=>{});

function normalize(v){try{return typeof v==='string'?JSON.parse(v):v}catch(e){return []}}
function getStock(){return normalize(AB.db.get('stock',[])).filter(x=>x&&x.id)}
function getUsage(){return normalize(AB.db.get('kitchen_usage',[]))}
function getPending(){return normalize(AB.db.get('kitchen_pending',[]))}
function savePending(v){AB.db.set('kitchen_pending',v)}

function drawStock(){
 const q=(stockSearch.value||'').trim().toLowerCase().replace(/\s+/g,' ');
 const stock=getStock().filter(x=>String(x.name||'').toLowerCase().replace(/\s+/g,' ').includes(q));
 stockCards.innerHTML=stock.map(x=>{
  const low=Number(x.qty)<=Number(x.min||0),isSel=selected.has(x.id);
  return '<div class="stock-card '+(isSel?'selected':'')+'"><b>'+esc(x.name)+'</b><p style="color:var(--mute);font-size:12px;margin:4px 0">'+esc(x.category||'Raw stock')+'</p><p>Available: <b class="'+(low?'low':'okc')+'">'+Number(x.qty)+' '+esc(x.unit||'pcs')+'</b></p><p style="margin:3px 0">'+(low?'<span class="tag low">LOW STOCK</span>':'<span class="tag">IN STOCK</span>')+'</p><button class="sm '+(isSel?'ghost':'')+'" onclick="toggleItem('+JSON.stringify(x.id)+')">'+(isSel?'Selected':'Select')+'</button></div>'
 }).join('')||'<div class="card">No matching stock items.</div>';drawSelected();
}
function toggleItem(id){if(selected.has(id))selected.delete(id);else{const x=getStock().find(s=>s.id===id);if(x)selected.set(id,{stockItemId:id,itemName:x.name,available:Number(x.qty),unit:x.unit||'pcs'})}drawStock()}
function drawSelected(){
 selectedBody.innerHTML=[...selected.values()].map((x,i)=>{
  const stock=getStock().find(s=>s.id===x.stockItemId);const available=stock?Number(stock.qty):x.available;const used=Number(x.usedQty||0);const remaining=available-used;
  const invalid=!Number.isFinite(used)||used<=0||used>available;
  return '<tr><td>'+ (i+1)+'</td><td><b>'+esc(x.itemName)+'</b></td><td>'+available+'</td><td>'+esc(x.unit)+'</td><td><input class="qty '+(invalid&&x.usedQty!==undefined?'invalid':'')+'" type="number" step="any" min="0.000001" value="'+(x.usedQty==null?'':esc(x.usedQty))+'" oninput="changeQty('+JSON.stringify(x.stockItemId)+',this.value)"></td><td class="'+(invalid?'err':'')+'">'+(x.usedQty==null?'':(Number.isFinite(remaining)?remaining:'-'))+'</td><td><button class="ghost sm" onclick="toggleItem('+JSON.stringify(x.stockItemId)+')">Remove</button></td></tr>'
 }).join('')||'<tr><td colspan="7" style="color:var(--mute)">No stock items selected.</td></tr>';
}
function changeQty(id,v){const x=selected.get(id);if(!x)return;x.usedQty=v===''?undefined:Number(v);drawSelected()}

async function saveKitchen(){
 if(saving)return;const items=[...selected.values()];
 if(!items.length)return alert('Select at least one stock item');
 for(const x of items){const used=x.usedQty;const stock=getStock().find(s=>s.id===x.stockItemId);if(!stock)return alert('Stock item was not found');if(!Number.isFinite(Number(used))||Number(used)<=0)return alert('Enter a valid used quantity for '+x.itemName);if(Number(used)>Number(stock.qty))return alert('Insufficient stock for '+x.itemName)}
 saving=true;saveBtn.disabled=true;saveBtn.textContent='Saving...';saveMsg.textContent='';saveMsg.className='';
 const usageId='KU-'+AB.uid().toUpperCase();
 const payload={usageId,items:items.map(x=>({stockItemId:x.stockItemId,usedQty:Number(x.usedQty)})),date:AB.today(),time:AB.now(),reference:ref.value.trim(),note:note.value.trim(),createdBy:currentUser||'',createdAt:new Date().toISOString()};
 try{
  const FBc=await window.__fbReady;const d=await FBc.kitchenCommit(payload);
  applyResult(d.record,d.stock);selected.clear();ref.value='';note.value='';lastRecord=d.record;saveMsg.textContent='Saved Successfully';saveMsg.className='okc';
 }catch(e){
  if(e&&e.validation){saveMsg.textContent=e.message;saveMsg.className='err';saving=false;saveBtn.disabled=false;saveBtn.textContent='SAVE KITCHEN USAGE';return}
  const stock=getStock(),usage=getUsage(),pending=getPending();
  const record={id:usageId,usageNo:usageId,date:payload.date,time:payload.time,reference:payload.reference,note:payload.note,createdBy:payload.createdBy,createdAt:payload.createdAt,items:[]};
  for(const x of payload.items){const s=stock.find(y=>y.id===x.stockItemId);const old=Number(s.qty);record.items.push({stockItemId:x.stockItemId,itemName:s.name,oldQty:old,usedQty:x.usedQty,remainingQty:round(old-x.usedQty),unit:s.unit||'pcs'});s.qty=round(old-x.usedQty)}
  usage.unshift(record);pending.push(payload);AB.db.set('stock',stock);AB.db.set('kitchen_usage',usage);savePending(pending);
  // append offline movement entries
  const moves=normalize(AB.db.get('moves',[]));record.items.forEach(x=>{const st=stock.find(y=>y.id===x.stockItemId)||{};moves.push({id:AB.uid(),date:record.date,time:record.time,itemId:x.stockItemId,name:x.itemName,category:st.category||'',unit:x.unit,kind:'out',qty:x.usedQty,rate:Number(st.rate)||0,total:round((Number(st.rate)||0)*x.usedQty),before:x.oldQty,after:x.remainingQty,by:record.createdBy,party:'Kitchen',note:'Kitchen usage '+record.id+(record.reference?' / '+record.reference:'')})});AB.db.set('moves',moves);
  selected.clear();ref.value='';note.value='';lastRecord=record;saveMsg.textContent='Saved offline. It will synchronize when online.';saveMsg.className='err';drawStock();
 }
 saving=false;saveBtn.disabled=false;saveBtn.textContent='SAVE KITCHEN USAGE';drawHistory();drawDaily();
}
function round(n){return Math.round((n+Number.EPSILON)*1000000)/1000000}
function applyResult(record,stock){AB.db.set('stock',stock);let usage=getUsage();usage=usage.filter(x=>x&&x.id!==record.id);usage.unshift(record);AB.db.set('kitchen_usage',usage)}
function printLast(){if(!lastRecord)return alert('No saved kitchen usage in this session');printRecord(lastRecord)}
function printRecord(r){
 const rows=r.items.map((x,i)=>'<tr style="border-bottom:1px dashed #000"><td>'+ (i+1)+'</td><td>'+esc(x.itemName)+'</td><td>'+Number(x.usedQty)+' '+esc(x.unit)+'</td></tr>').join('');
 const total=r.items.reduce((n,x)=>n+Number(x.usedQty),0);
 AB.win('Kitchen Stock Usage','<p><b>Kitchen Usage No:</b> '+esc(r.usageNo||r.id)+'</p><p>Date: '+esc(r.date)+' &nbsp; Time: '+esc(r.time)+'</p><p>Reference/Hawala: '+esc(r.reference||'-')+'</p><p>Note: '+esc(r.note||'-')+'</p><table><tr><th>NO</th><th>ITEM</th><th>USED QTY</th></tr>'+rows+'</table><p style="margin-top:6px">Total Items: '+r.items.length+'</p><p>Total Qty: '+total+'</p><p>Reference/Hawala: '+esc(r.reference||'-')+'</p><p>Prepared/Issued By: '+esc(r.createdBy||'-')+'</p><p style="text-align:center;margin-top:8px">Kitchen Usage Record Saved Successfully</p>');
}
function viewRecord(id){const r=getUsage().find(x=>x.id===id);if(!r)return;const details=(r.items||[]).map((x,i=1)=>x.itemName+' - '+Number(x.usedQty)+' '+(x.unit||'')).join('\n');alert('Kitchen Usage No: '+(r.usageNo||r.id)+'\nDate: '+r.date+' '+(r.time||'')+'\nReference/Hawala: '+(r.reference||'-')+'\nNote: '+(r.note||'-')+'\nCreated By: '+(r.createdBy||'-')+'\n\n'+details)}
function printRecordId(id){const r=getUsage().find(x=>x.id===id);if(r)printRecord(r)}
function drawHistory(){
 const q=(recordSearch.value||'').trim().toLowerCase().replace(/\s+/g,' ');
 const f=fromDate.value,t=toDate.value;
 const rows=getUsage().filter(r=>{
  if(f&&r.date<f)return false;if(t&&r.date>t)return false;
  const hay=[r.id,r.reference,r.date,r.createdBy,...(r.items||[]).map(x=>x.itemName)].join(' ').toLowerCase().replace(/\s+/g,' ');
  return !q||hay.includes(q)
 });
  historyBody.innerHTML=rows.map(r=>'<tr><td><b>'+esc(r.usageNo||r.id)+'</b></td><td>'+esc(r.date)+'</td><td>'+esc(r.time||'-')+'</td><td>'+esc(r.reference||'-')+'</td><td>'+esc((r.items||[]).map(x=>x.itemName+' '+Number(x.usedQty)+' '+(x.unit||'')).join(', '))+'</td><td>'+round((r.items||[]).reduce((n,x)=>n+Number(x.usedQty||0),0))+'</td><td>'+esc(r.createdBy||'-')+'</td><td><button class="ghost sm" onclick="viewRecord('+JSON.stringify(r.id).replace(/"/g,'&quot;')+')">VIEW</button> <button class="sm" onclick="printRecordId('+JSON.stringify(r.id).replace(/"/g,'&quot;')+')">PRINT</button></td></tr>').join('')||'<tr><td colspan="8" style="color:var(--mute)">No kitchen records found.</td></tr>';
}
function drawDaily(){const date=summaryDate.value||AB.today(),rows=getUsage().filter(r=>r.date===date),totals={};rows.forEach(r=>(r.items||[]).forEach(x=>{totals[x.itemName]=(totals[x.itemName]||0)+Number(x.usedQty)}));dailySummary.innerHTML='<b>Date: '+esc(date)+'</b><br>'+Object.keys(totals).map(name=>esc(name)+' <b>'+round(totals[name])+'</b>').join('<br>')+(Object.keys(totals).length?'<br>':'No usage items.')+'<br>Total Usage Records: '+rows.length}
function printDaily(){const date=summaryDate.value||AB.today(),rows=getUsage().filter(r=>r.date===date),totals={};rows.forEach(r=>(r.items||[]).forEach(x=>{totals[x.itemName]=(totals[x.itemName]||0)+Number(x.usedQty)}));const body='<h2 style="font-size:11px;text-align:center">DAILY KITCHEN REPORT</h2><p>Date: '+esc(date)+'</p><table>'+Object.keys(totals).map(name=>'<tr><td>'+esc(name)+'</td><td>'+round(totals[name])+' '+esc((rows.flatMap(r=>r.items||[]).find(x=>x.itemName===name)||{}).unit||'')+'</td></tr>').join('')+'</table><p style="margin-top:6px">Total Usage Records: '+rows.length+'</p>';AB.win('Daily Kitchen Report',body)}
async function syncPending(){if(!navigator.onLine)return;for(const payload of getPending().slice()){try{const FBc=await window.__fbReady;const d=await FBc.kitchenCommit(payload);applyResult(d.record,d.stock||getStock());let moves=normalize(AB.db.get('moves',[]));moves=moves.filter(x=>!(String(x.note||'').includes('Kitchen usage '+d.record.id)));AB.db.set('moves',moves);const pending=getPending().filter(x=>x.usageId!==payload.usageId);savePending(pending)}catch(e){if(e&&e.validation){/* rejected for good (e.g. not enough stock): park it, never block the rest of the queue */const bad=AB.db.get('kitchen_failed',[]);bad.push(Object.assign({},payload,{error:e.message,failedAt:new Date().toISOString()}));AB.db.set('kitchen_failed',bad);savePending(getPending().filter(x=>x.usageId!==payload.usageId));if(window.abDiag)abDiag.log('kitchen','queued usage rejected: '+e.message,payload.usageId);try{toast('A saved offline entry was rejected: '+e.message)}catch(x){}continue}break}}drawStock();drawHistory();drawDaily()}
stockSearch.addEventListener('input',drawStock);recordSearch.addEventListener('input',drawHistory);summaryDate.addEventListener('change',drawDaily);fromDate.value=AB.today().slice(0,8)+'01';toDate.value=AB.today();window.addEventListener('online',syncPending);drawStock();drawHistory();drawDaily();syncPending();
</script><script src="ping.js"></script></body></html>

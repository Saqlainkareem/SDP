<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alpha Bakers · Production</title><script src="ab-sync.js" data-pos="0"></script><script src="frame.js"></script><script type="module" src="firebase-core.js"></script><style>
:root{--bg:#f8fafc;--line:#e2e8f0;--ink:#1e293b;--mute:#64748b;--gold:#b8892a;--goldd:#8a6418;--goldl:#fbf5e6;--bad:#dc2626;--ok:#16a34a}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--ink);font:14px 'DM Sans',system-ui,Segoe UI,sans-serif;display:flex;min-height:100vh}
aside{width:232px;background:#fff;border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;flex-shrink:0;overflow:auto}
.brand{text-align:center;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:12px}.brand img{width:84px;height:84px;border-radius:50%;border:2px solid var(--gold)}
.brand b{display:block;font:700 19px Georgia,serif;color:var(--goldd);letter-spacing:.14em;margin-top:6px}.brand small{color:var(--mute);letter-spacing:.3em;font-size:9px}
aside a{display:flex;gap:10px;padding:10px 12px;border-radius:10px;color:var(--ink);text-decoration:none;margin-bottom:2px;font-weight:600}
aside a:hover{background:var(--goldl)}aside a.on{background:var(--gold);color:#fff}aside a.soon{opacity:.35;pointer-events:none}aside a.soon::after{content:'soon';margin-left:auto;font-size:9px;align-self:center}
main{flex:1;padding:24px 30px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:18px}
.top h1{font:800 26px Georgia,serif;color:var(--goldd);letter-spacing:.04em}.top p{color:var(--mute);font-size:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}.g2{display:grid;gap:16px;grid-template-columns:1fr 1fr}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 1px 2px #0000000a}
.card h3{font:700 15px Georgia,serif;color:var(--goldd);margin-bottom:10px;letter-spacing:.03em}
.stat small{color:var(--mute);text-transform:uppercase;letter-spacing:.08em;font-size:10px;font-weight:700}.stat b{display:block;font-size:22px;margin-top:4px}.stat.g{background:var(--goldl);border-color:#ecd391}
.mod{text-decoration:none;color:inherit;display:block;transition:.15s}.mod:hover{border-color:var(--gold);transform:translateY(-2px)}.mod h4{color:var(--goldd);margin:6px 0 3px;font-size:15px}.mod p{color:var(--mute);font-size:12px}
button,select,input,textarea{font:inherit;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 11px}
input,select{width:100%}input:focus,select:focus{outline:2px solid #ecd391;border-color:var(--gold)}
button{cursor:pointer;background:var(--gold);color:#fff;font-weight:700;border:0}button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}button.red{background:#fee2e2;color:var(--bad)}button.sm{padding:5px 9px;font-size:12px}button:hover{filter:brightness(.95)}
label{display:block;font-size:10px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--mute);font-size:10px;text-transform:uppercase;letter-spacing:.08em;background:#f8fafc}th,td{padding:9px 8px;border-bottom:1px solid var(--line)}tr:hover td{background:#fffdf7}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.row>div,.row>input,.row>select{flex:1;min-width:130px}.row>button{flex:0 0 auto}
.tag{padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;background:#f1f5f9}.low{color:var(--bad);font-weight:700}.okc{color:var(--ok);font-weight:700}
.deliv{background:#1e293b;color:#fff;font-weight:800;letter-spacing:.1em}.sc{overflow:auto}.bar{background:var(--gold);border-radius:6px 6px 0 0;min-height:2px}
.chart{display:flex;align-items:end;gap:10px;height:140px}.chart div{flex:1;text-align:center;font-size:10px;color:var(--mute);display:flex;flex-direction:column;justify-content:end;height:100%}
@media(max-width:850px){body{flex-direction:column}aside{width:100%;height:auto;position:static}.g2{grid-template-columns:1fr}main{padding:14px}}
@media print{aside,.np{display:none!important}main{padding:0}}
</style></head><body><main>
<div id="hd"></div><div class="grid" id="sum" style="margin-bottom:14px"></div>
<div class="g2"><div class="card"><h3>Produce a batch</h3><div class="row"><div><label>Recipe</label><select id="pr" onchange="prev()"></select></div><div><label>No. of batches</label><input id="nb" type="number" value="1" min="1" oninput="prev()"></div><button onclick="produce()">Produce</button></div><div id="pv" style="margin-top:10px;color:var(--mute)"></div></div>
<div class="card"><h3>Record wastage</h3><div class="row"><div><label>Product</label><input id="wp" list="pl"><datalist id="pl"></datalist></div><div><label>Qty</label><input id="wq" type="number"></div><div><label>Reason</label><input id="wr" placeholder="Burnt, expired..."></div><button class="red" onclick="waste()">Save</button></div></div></div>
<div class="card" style="margin-top:14px"><h3>Add recipe</h3><div class="row"><div><label>Product (POS item)</label><input id="rp" list="pl"></div><div><label>Yield per batch</label><input id="ry" type="number"></div><button class="ghost" onclick="addIng()">+ Ingredient</button><button onclick="saveR()">Save recipe</button></div><div id="ings" style="margin-top:8px"></div></div>
<div class="card sc" style="margin-top:14px"><h3>Recipes</h3><table><thead><tr><th>Product</th><th>Yield</th><th>Ingredients</th><th>Cost / batch</th><th>Cost / piece</th><th></th></tr></thead><tbody id="rt"></tbody></table></div>
<div class="g2" style="margin-top:14px"><div class="card sc"><h3>Production log</h3><table><thead><tr><th>Date</th><th>Product</th><th>Batches</th><th>Qty</th><th>Cost</th></tr></thead><tbody id="pl2"></tbody></table></div>
<div class="card sc"><h3>Wastage log</h3><table><thead><tr><th>Date</th><th>Product</th><th>Qty</th><th>Reason</th><th>Loss</th></tr></thead><tbody id="wl"></tbody></table></div></div></main><script>
